<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구구단 - for문(숙제)</title>
    <link rel="stylesheet" href="css/gugudan.css">

</head>

<body>
    <h1>구구단</h1><hr>
    <script>
        var i, j;

        document.write("<div style='display:flex; gap:30px;'>");

        for(i = 1; i <= 9; i++) {
            document.write("<div align='center'>");       // 각 단 묶음 시작
            document.write("<h3>" + i + "단</h3>");       // 단 제목

            for(j = 1; j <= 9; j++) {
                document.write(i + " X " + j + " = " + (i * j) + "<br>");
            }

            document.write("</div>");                     // 각 단 묶음 끝
        }

        document.write("</div>");
    </script>
</body>
</html>
